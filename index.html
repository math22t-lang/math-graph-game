<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>함수 그래프 매칭 챌린지</title><style>body{font-family:system-ui,sans-serif;background:#f3f6fb;color:#152238;margin:0;padding:16px}.app{max-width:620px;margin:auto;background:white;padding:20px;border-radius:18px;box-shadow:0 6px 30px #15223816}h1{font-size:23px}input,button{font:inherit;padding:11px;border-radius:9px;border:1px solid #ccd3df}input{width:100%;box-sizing:border-box;margin:5px 0 12px}button{background:#275ddd;color:white;border:0;cursor:pointer}button:disabled{opacity:.5}.row{display:flex;align-items:center;justify-content:space-between;gap:8px}.hidden{display:none}canvas{width:100%;border:1px solid #e0e6f0;border-radius:10px;touch-action:none}.controls{display:grid;grid-template-columns:minmax(0,1fr) 44px 42px 44px;align-items:center;gap:8px;margin:10px 0}.controls button{width:44px;height:44px;padding:0;display:grid;place-items:center;font-size:24px;font-weight:700;line-height:1;box-sizing:border-box}.controls .value{text-align:center;font-weight:700;font-variant-numeric:tabular-nums}.formula-card{background:#eff5ff;border:1px solid #cbdcfb;border-radius:14px;padding:13px 10px;text-align:center;margin:12px 0}.symbolic{font-size:clamp(22px,5vw,29px);font-weight:750;white-space:nowrap}.symbolic .var{color:#245dd5}.fraction{display:inline-flex;vertical-align:middle;flex-direction:column;align-items:center;line-height:1.25}.fraction .num{border-bottom:2px solid currentColor;padding:0 8px 3px}.fraction .den{padding:3px 3px 0}.live-formula{font-size:17px;font-weight:700;margin-top:10px;color:#34445d}.guide{font-size:12px;color:#59677e;margin-top:8px;line-height:1.6}.score-rule{font-weight:700;color:#275ddd;font-size:14px}.muted{color:#65748a;font-size:13px}.pill{background:#e9efff;border-radius:30px;padding:6px 10px}.rank{width:100%;border-collapse:collapse}td,th{border-bottom:1px solid #eee;padding:9px;text-align:left}#msg{min-height:26px;font-weight:bold}label{font-weight:600}.dpad-wrap{background:#f1f5fc;border-radius:18px;padding:14px;margin:12px 0}.dpad-title{font-weight:800;text-align:center;margin-bottom:10px}.dpad{display:grid;grid-template-columns:repeat(3,64px);grid-template-rows:repeat(3,58px);gap:5px;justify-content:center}.dpad button{width:64px;height:58px;padding:0;border-radius:13px;font-size:29px;font-weight:800;background:#263d66;display:grid;place-items:center;touch-action:manipulation}.dpad .center{background:#dce5f5;color:#3b4c68;display:grid;place-items:center;border-radius:12px;font-size:11px;text-align:center;font-weight:800}.dpad .empty{visibility:hidden}.adjust-row{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:10px 0}.adjust-row button{width:50px;height:50px;flex:0 0 50px;display:grid;place-items:center;padding:0;font-size:25px;font-weight:800;line-height:1;box-sizing:border-box}.adjust-row .value{font-size:22px;font-weight:800;min-width:34px;text-align:center}.adjust-row .adjust-name{flex:1}.math-render{min-height:56px;display:flex;justify-content:center;align-items:center;overflow-x:auto;font-size:24px}.math-render .MathJax{max-width:100%}.math-fallback{font-size:21px;overflow-wrap:anywhere}.math-help{font-size:13px;color:#56647b;line-height:1.7}.move-hint{text-align:center;color:#53627c;font-size:13px;margin:6px 0}.controls{display:block}.formula-card{padding:14px 8px}#check{min-height:52px;font-weight:800}@media(max-width:380px){.dpad{grid-template-columns:repeat(3,57px);grid-template-rows:repeat(3,54px)}.dpad button{width:57px;height:54px}} </style><script>window.MathJax={tex:{inlineMath:[['\\(','\\)']]},svg:{fontCache:'global'},startup:{typeset:false}};</script><script defer src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js"></script></head><body><main class="app"><h1>🎮 함수 그래프 매칭 챌린지</h1><section id="login"><p>학번과 이름을 입력하고 3분 동안 그래프를 최대한 많이 맞혀 보세요. 정답 +10점, 오답 −3점입니다.</p><label>학번</label><input id="studentId" maxlength="20" placeholder="예: 10301"><label>이름</label><input id="studentName" maxlength="20" placeholder="이름"><button id="start">게임 시작</button><p class="muted">전체 랭킹은 Firebase에 저장됩니다. 학번은 이 기기에서만 사용하며, 랭킹에는 이름 일부만 표시됩니다.</p></section><section id="play" class="hidden"><div class="row"><strong id="who"></strong><strong class="pill" id="time">03:00</strong><strong id="score">0점</strong></div><p id="kind"></p><canvas id="graph" width="600" height="430"></canvas><p class="muted">🔵 파란색: 목표 그래프　🟠 주황색: 내 그래프</p><div class="formula-card"><div id="symbolic" class="math-render"></div><div id="formula" class="math-render"></div><div id="formulaGuide" class="guide"></div></div><p class="score-rule">정답 +10점 · 오답 −3점 (최저 0점)</p><div id="controls"></div><button id="check" style="width:100%">정답 확인</button><p id="msg" aria-live="polite"></p></section><section id="end" class="hidden"><h2>⏰ 게임 종료!</h2><p id="result"></p><h3>전체 학생 랭킹</h3><table class="rank"><thead><tr><th>순위</th><th>이름</th><th>점수</th></tr></thead><tbody id="ranking"></tbody></table><p class="muted">인터넷 연결이 필요합니다. 익명 인증 방식의 시범 랭킹이며, 학생 본인 확인과 부정행위 방지는 별도로 필요합니다.</p><button onclick="location.reload()">다시 도전</button></section></main><script>
const $=id=>document.getElementById(id);let kind,target,values,score=0,correctCount=0,wrongCount=0,deadline,timer,playing=false,who='',studentId='';const canvas=$('graph'),ctx=canvas.getContext('2d');const bounds={a:[-3,3],h:[-4,4],k:[-4,4],b:[-1,1]};function rand(arr){return arr[Math.floor(Math.random()*arr.length)]}function randomA(){return rand([-3,-2,-1,1,2,3])}function next(){kind=Math.random()<.5?'rational':'radical';target={a:randomA(),h:rand([-3,-2,-1,0,1,2,3]),k:rand([-3,-2,-1,0,1,2,3]),b:rand([-1,1])};values={a:1,h:0,k:0,b:1};$('kind').textContent=kind==='rational'?'유리함수: 목표 그래프에 맞추세요':'무리함수: 좌우·상하 대칭도 활용하세요';$('msg').textContent='';renderControls();draw()}function fmt(n){return n<0?`+ ${-n}`:`− ${n}`}function changeValue(key,step){if(!playing)return;if(key==='b')values.b=-values.b;else{let v=values[key]+step;if(key==='a'&&v===0)v+=step;values[key]=Math.max(bounds[key][0],Math.min(bounds[key][1],v))}$('msg').textContent='';renderControls();draw()}
function renderControls(){const move=(dir,key,step,aria)=>`<button type="button" data-key="${key}" data-step="${step}" aria-label="${aria}">${dir}</button>`;let html=`<div class="dpad-wrap"><div class="dpad-title">🕹️ 그래프 이동</div><div class="dpad"><span class="empty"></span>${move('▲','k',1,'위로 이동')}<span class="empty"></span>${move('◀','h',-1,'왼쪽 이동')}<div class="center">이동<br>버튼</div>${move('▶','h',1,'오른쪽 이동')}<span class="empty"></span>${move('▼','k',-1,'아래로 이동')}<span class="empty"></span></div><div class="move-hint">좌우: h = ${values.h} &nbsp; | &nbsp; 상하: k = ${values.k}</div></div>`;html+=`<div class="adjust-row"><strong class="adjust-name">a · 상하 방향 / 모양</strong>${move('−','a',-1,'a 감소')}<span class="value">${values.a}</span>${move('+','a',1,'a 증가')}</div>`;if(kind==='radical')html+=`<div class="adjust-row"><strong class="adjust-name">b · 좌우 대칭</strong><button type="button" data-key="b" data-step="1" style="width:auto;flex:0 0 auto;padding:0 14px;font-size:15px">좌우 반전 ↔</button><span class="value">${values.b>0?'+1':'−1'}</span></div>`;$('controls').innerHTML=html;$('controls').querySelectorAll('button').forEach(btn=>btn.onclick=()=>changeValue(btn.dataset.key,Number(btn.dataset.step)))}
function fx(x,p){if(kind==='rational'){if(Math.abs(x-p.h)<.001)return NaN;return p.a/(x-p.h)+p.k}let rad=p.b*(x-p.h);return rad<0?NaN:p.a*Math.sqrt(rad)+p.k}function draw(){ctx.clearRect(0,0,600,430);const ox=300,oy=215,s=37;ctx.lineWidth=1;for(let i=-8;i<=8;i++){ctx.strokeStyle='#e9edf5';ctx.beginPath();ctx.moveTo(ox+i*s,0);ctx.lineTo(ox+i*s,430);ctx.stroke()}for(let j=-6;j<=6;j++){ctx.beginPath();ctx.moveTo(0,oy+j*s);ctx.lineTo(600,oy+j*s);ctx.stroke()}ctx.strokeStyle='#65748a';ctx.beginPath();ctx.moveTo(0,oy);ctx.lineTo(600,oy);ctx.moveTo(ox,0);ctx.lineTo(ox,430);ctx.stroke();ctx.fillStyle='#65748a';ctx.font='13px sans-serif';ctx.fillText('x',582,oy-8);ctx.fillText('y',ox+9,14);function curve(p,color,width){ctx.strokeStyle=color;ctx.lineWidth=width;ctx.beginPath();let active=false,lastY=null;for(let px=0;px<=600;px+=.7){let x=(px-ox)/s,y=fx(x,p),py=oy-y*s;if(!Number.isFinite(py)||py< -1000||py>1430){active=false;lastY=null;continue}if(!active||lastY===null||Math.abs(py-lastY)>65){ctx.moveTo(px,py)}else ctx.lineTo(px,py);active=true;lastY=py}ctx.stroke()}curve(target,'#2563eb',5);curve(values,'#f97316',3);renderFormula()}function renderFormula(){let p=values;const symbolic=kind==='rational'?String.raw`y=\frac{\color{#245dd5}{a}}{x-\color{#245dd5}{h}}+\color{#245dd5}{k}`:String.raw`y=\color{#245dd5}{a}\sqrt{\color{#245dd5}{b}(x-\color{#245dd5}{h})}+\color{#245dd5}{k}`;const signed=(n)=>n<0?`+${-n}`:`-${n}`;const tail=(n)=>n<0?`-${-n}`:`+${n}`;const live=kind==='rational'?String.raw`y=\frac{${p.a}}{x${signed(p.h)}}${tail(p.k)}`:String.raw`y=${p.a}\sqrt{${p.b===-1?'-':''}(x${signed(p.h)})}${tail(p.k)}`;$('symbolic').textContent='\\('+symbolic+'\\)';$('formula').textContent='\\('+live+'\\)';$('formulaGuide').textContent=kind==='rational'?'a: 방향·모양 | 화살표: 좌우·상하 이동':'a: 상하 방향·모양 | b: 좌우 반전 | 화살표: 좌우·상하 이동';if(window.MathJax&&MathJax.typesetPromise){MathJax.typesetClear?.([$('symbolic'),$('formula')]);MathJax.typesetPromise([$('symbolic'),$('formula')]).catch(()=>{})}}
$('start').onclick=()=>{studentId=$('studentId').value.trim();who=$('studentName').value.trim();if(!studentId||!who){alert('학번과 이름을 입력하세요.');return}score=0;correctCount=0;wrongCount=0;$('score').textContent='0점';$('who').textContent=who;$('login').classList.add('hidden');$('play').classList.remove('hidden');deadline=Date.now()+180000;playing=true;next();timer=setInterval(tick,200);tick()};function tick(){let remaining=Math.max(0,deadline-Date.now()),sec=Math.ceil(remaining/1000);$('time').textContent=`${String(Math.floor(sec/60)).padStart(2,'0')}:${String(sec%60).padStart(2,'0')}`;if(remaining<=0)finish()}$('check').onclick=()=>{if(!playing)return;let keys=kind==='rational'?['a','h','k']:['a','b','h','k'];if(keys.every(k=>values[k]===target[k])){score+=10;correctCount++;$('score').textContent=score+'점';next();$('msg').textContent='정답! +10점 🎉'}else {wrongCount++;score=Math.max(0,score-3);$('score').textContent=score+'점';$('msg').textContent='오답! −3점. 그래프를 다시 살펴보세요.'}};function finish(){if(!playing)return;playing=false;clearInterval(timer);$('play').classList.add('hidden');$('end').classList.remove('hidden');$('result').textContent=`${who} 학생: ${score}점 (정답 ${correctCount}개, 오답 ${wrongCount}회)`;$('ranking').innerHTML='<tr><td colspan="3">전체 랭킹을 불러오는 중...</td></tr>';window.submitGameScore(score,correctCount,wrongCount,who).catch(e=>{console.error(e);$('ranking').innerHTML='<tr><td colspan="3">저장 실패: Firebase 설정 및 보안 규칙을 확인하세요.</td></tr>'})}
</script>
<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/11.10.0/firebase-app.js';
import { getAuth, signInAnonymously, onAuthStateChanged } from 'https://www.gstatic.com/firebasejs/11.10.0/firebase-auth.js';
import { getFirestore, doc, getDoc, setDoc, collection, query, orderBy, limit, getDocs, serverTimestamp } from 'https://www.gstatic.com/firebasejs/11.10.0/firebase-firestore.js';
const firebaseConfig = {
 apiKey: "AIzaSyDtKzE01nqIqHAvXrpfzz8_QyD0P9XLL_Y",
 authDomain: "math-graph-game.firebaseapp.com",
 projectId: "math-graph-game",
 storageBucket: "math-graph-game.firebasestorage.app",
 messagingSenderId: "395240680768",
 appId: "1:395240680768:web:da11bde1d2f595c706dea5"
};
const app=initializeApp(firebaseConfig), auth=getAuth(app), db=getFirestore(app);
const signedIn=new Promise((resolve,reject)=>{const unsubscribe=onAuthStateChanged(auth,u=>{if(u){unsubscribe();resolve(u)}},reject);signInAnonymously(auth).catch(reject)});
const maskName=name=>name.length<2?'학생':name[0]+'○'.repeat(Math.min(name.length-1,3));
window.submitGameScore=async(score,correct,wrong,name)=>{
 const user=await signedIn;
 const ref=doc(db,'leaderboard',user.uid);
 const previous=await getDoc(ref);
 if(!previous.exists() || score>previous.data().bestScore){
  await setDoc(ref,{displayName:maskName(name),bestScore:score,correctCount:correct,wrongCount:wrong,updatedAt:serverTimestamp()});
 }
 const results=await getDocs(query(collection(db,'leaderboard'),orderBy('bestScore','desc'),limit(20)));
 const body=document.getElementById('ranking');body.replaceChildren();
 let index=0;
 results.forEach(item=>{const data=item.data();const tr=document.createElement('tr');
  [String(++index),String(data.displayName||'학생'),String(data.bestScore||0)].forEach(value=>{const td=document.createElement('td');td.textContent=value;tr.appendChild(td)});body.appendChild(tr)});
 if(!index)body.innerHTML='<tr><td colspan="3">아직 기록이 없습니다.</td></tr>';
};
</script></body></html>
